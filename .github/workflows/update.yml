name: Update conditions

on:
  schedule:
    # Hourly at :23 - off the top/half of the hour, when GitHub is busiest and most likely
    # to skip scheduled runs. Even with skipped runs the page should refresh well within 6 hours.
    - cron: "23 * * * *"
  workflow_dispatch:          # "Run workflow" button in the Actions tab
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy1.outputs.page_url || steps.deploy2.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Test rules
        run: python -m unittest discover tests

      - name: Fetch data and build
        run: python scripts/build.py || (sleep 20 && python scripts/build.py)

      # GitHub pauses scheduled workflows after 60 days without commits.
      # A tiny monthly commit keeps the dashboard updating.
      - name: Keep schedule alive
        if: github.event_name == 'schedule'
        run: |
          if [ "$(date -u +%d)" = "01" ] && [ "$(date -u +%H)" = "00" ]; then
            date -u > .github/keepalive
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/keepalive && git commit -m "Keepalive" && git push
          fi

      # Version the page's code files so browsers fetch new code after each change.
      - name: Stamp code version
        run: |
          V=$(python -c "import json; print(json.load(open('site/data/latest.json'))['site_version'])")
          sed -i -E "s/(app\.js|styles\.css|config\.js)\"/\1?v=$V\"/g" site/index.html
          grep -E "app.js|styles.css|config.js" site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      # Publishing occasionally times out on GitHub's side ("Failed to get ID Token").
      # Try once more before giving up.
      - id: deploy1
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Wait before retrying publish
        if: steps.deploy1.outcome == 'failure'
        run: sleep 30

      - id: deploy2
        if: steps.deploy1.outcome == 'failure'
        uses: actions/deploy-pages@v4
